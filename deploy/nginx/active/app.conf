server {
    listen 80;
    server_name api.hiddenlightyouth.yuns.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.hiddenlightyouth.yuns.kr;

    ssl_certificate     /etc/letsencrypt/live/api.hiddenlightyouth.yuns.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hiddenlightyouth.yuns.kr/privkey.pem;

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 120m;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
    }
}
