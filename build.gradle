plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.yuns'
version = '0.0.1-SNAPSHOT'
description = 'dropthepitch-server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    springAiVersion = '2.0.0'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    implementation 'software.amazon.awssdk:s3:2.28.16'

//    Gemini
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'

//    썸네일 추출. ffmpeg 바이너리가 jar에 들어있어 서버에 따로 설치하지 않는다.
//    classifier로 운영체제별 바이너리를 고른다. 맞는 것이 없으면 실행 시 UnsatisfiedLinkError가 난다.
//    개발은 맥(arm64), 배포 서버는 리눅스(x86_64)라 둘만 넣는다.
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    implementation 'org.bytedeco:javacv:1.5.14'
    implementation group: 'org.bytedeco', name: 'ffmpeg', version: '8.1.2-1.5.14', classifier: 'linux-x86_64'
    implementation group: 'org.bytedeco', name: 'ffmpeg', version: '8.1.2-1.5.14', classifier: 'macosx-arm64'
}

tasks.named('test') {
    useJUnitPlatform()
}
