spring:
  application:
    name: dropthepitch-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MariaDBDialect
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:1GB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:1GB}
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-3.1-flash-lite
          max-output-tokens: 4096
          thinking-level: MINIMAL
    retry:
      max-attempts: 3
      on-client-errors: false
      backoff:
        initial-interval: 2s
        multiplier: 2
        max-interval: 20s

jwt:
  access-token:
    expire-time: ${JWT_ACCESS_TOKEN_EXPIRE_TIME:3600000}
  refresh-token:
    expire-time: ${JWT_REFRESH_TOKEN_EXPIRE_TIME:604800000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

aws:
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_S3_REGION:ap-northeast-2}


