spring:
  application:
    name: dropthepitch-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dropthepitch}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        format_sql: false
        show_sql: false
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:110MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:110MB}
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-3.1-flash-lite
          max-output-tokens: 16384
          thinking-level: MINIMAL
    retry:
      max-attempts: 3
      on-client-errors: false
      backoff:
        initial-interval: 2s
        multiplier: 2
        max-interval: 20s

jwt:
  secret: ${JWT_SECRET_KEY:}
  access-token:
    expire-time: ${JWT_ACCESS_TOKEN_EXPIRE_TIME:3600000}
  refresh-token:
    expire-time: ${JWT_REFRESH_TOKEN_EXPIRE_TIME:604800000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

aws:
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_S3_REGION:ap-northeast-2}

logging:
  level:
    kr.yuns.dropthepitchserver: DEBUG
    org.hibernate.SQL: DEBUG
